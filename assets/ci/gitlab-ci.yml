stages:
  - evaluate

variables:
  SKILL_EVALUATOR_PATH: "skill-evaluator"
  # Set FAIL_ON_BELOW_S to "false" to allow below-S-grade skills to pass CI
  FAIL_ON_BELOW_S: "true"

skill-evaluation-layer1:
  stage: evaluate
  image: python:3.11-slim
  # Trigger only on .md changes, excluding skill-evaluator's own files
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/SKILL.md"
        - "**/references/**"
        - "**/assets/templates/**"
        - "**/*.md"
      when: always
    - if: $CI_PIPELINE_SOURCE == "web"  # manual trigger from UI
      when: manual
  before_script:
    - pip install requests
  script: |
    SKILL_PATH="${SKILL_PATH:-.}"

    if [ "$SKILL_PATH" = "." ]; then
      SKILLS=$(find . -name 'SKILL.md' \
        -not -path './SKILL.md' \
        -not -path './skill-evaluator/SKILL.md' \
        -not -path './eval-results/*')
    else
      SKILLS="$SKILL_PATH/SKILL.md"
    fi

    if [ -z "$SKILLS" ]; then
      echo "No SKILL.md files found to evaluate."
      exit 0
    fi

    mkdir -p eval-results
    FAILED_SKILLS=()

    # Restore incremental state if cached
    if [ -f "$CI_PROJECT_DIR/.cache/eval-state.json" ]; then
      cp "$CI_PROJECT_DIR/.cache/eval-state.json" eval-results/eval-state.json
      echo "Restored eval-state.json from cache — incremental evaluation enabled."
    else
      echo "No cached eval-state.json — full evaluation will run."
    fi

    for SKILL in $SKILLS; do
      SKILL_DIR=$(dirname "$SKILL")
      SKILL_NAME=$(basename "$SKILL_DIR")
      TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
      OUTPUT_DIR="eval-results/$SKILL_NAME"
      mkdir -p "$OUTPUT_DIR"

      echo "====================================="
      echo "Evaluating: $SKILL_NAME (Layer 1)"
      echo "Output: $OUTPUT_DIR/layer1_${TIMESTAMP}.md"
      echo "====================================="

      EXIT_CODE=0
      if command -v claude &> /dev/null; then
        claude --skill skill-evaluator \
          "评估 $SKILL，仅执行第一层，单模型模式" \
          > "$OUTPUT_DIR/layer1_${TIMESTAMP}.md" 2>&1 || EXIT_CODE=$?
      else
        echo "Claude CLI not available." > "$OUTPUT_DIR/layer1_${TIMESTAMP}.md"
        echo "Install: npm install -g @anthropic-ai/claude-code"
        EXIT_CODE=1
      fi

      # Check for below-S grade
      if [ "$FAIL_ON_BELOW_S" = "true" ] && [ -f "$OUTPUT_DIR/layer1_${TIMESTAMP}.md" ]; then
        if grep -qE '等级[[:space:]]*[BCDE]|grade[[:space:]]*:[[:space:]]*"[BCDE]"' \
          "$OUTPUT_DIR/layer1_${TIMESTAMP}.md"; then
          echo "⚠ $SKILL_NAME has files below S grade."
          FAILED_SKILLS+=("$SKILL_NAME")
        fi
      fi
    done

    # Note: Layer 2 and Layer 3 evaluations must be run manually.
    # Layer 2 prerequisite: all Layer 1 results S grade.
    # Layer 3 prerequisite: all Layer 2 results S grade.
    # Run: claude --skill skill-evaluator '评估 <path>，执行第二层/第三层'

    # Save incremental state for next pipeline
    if [ -f "eval-results/eval-state.json" ]; then
      mkdir -p "$CI_PROJECT_DIR/.cache"
      cp eval-results/eval-state.json "$CI_PROJECT_DIR/.cache/eval-state.json"
    fi

    # Fail pipeline if any skill is below S grade
    if [ "${#FAILED_SKILLS[@]}" -gt 0 ]; then
      echo ""
      echo "❌ Pipeline FAILED: The following skills have files below S grade (9.0):"
      for s in "${FAILED_SKILLS[@]}"; do
        echo "  - $s"
      done
      exit 1
    fi

    echo "✅ All evaluated skills passed Layer 1 quality check."

  artifacts:
    when: always
    paths:
      - eval-results/
    expire_in: 90 days
  cache:
    key: eval-state-$CI_PROJECT_ID-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/eval-state.json
  variables:
    DEEPSEEK_API_KEY: $DEEPSEEK_API_KEY
    ANTHROPIC_API_KEY: $ANTHROPIC_API_KEY
