name: Skill Evaluation (v3.2 — 三层评估 + 全量扫描 + 增量评估)

on:
  push:
    paths:
      - '**/SKILL.md'
      - '**/references/**'
      - '**/assets/templates/**'
      - '**/*.md'
  pull_request:
    paths:
      - '**/SKILL.md'
      - '**/references/**'
      - '**/assets/templates/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      skill_path:
        description: 'Path to the Skill directory to evaluate (default: all skills in repo)'
        required: false
        default: '.'
      layers:
        description: 'Evaluation layers to run: 1 / 2 / 3 / all (default: 1 for CI, all for manual)'
        required: false
        default: '1'
      fail_on_below_s:
        description: 'Fail CI if any skill is below S grade (9.0)'
        required: false
        default: 'true'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # Restore incremental evaluation state cache
      - name: Restore eval-state cache
        uses: actions/cache@v4
        with:
          path: eval-results/eval-state.json
          key: eval-state-${{ github.repository }}-${{ github.ref_name }}
          restore-keys: |
            eval-state-${{ github.repository }}-

      - name: Run Skill Evaluation (Layer 1 — File Quality)
        id: layer1
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SKILL_PATH="${{ github.event.inputs.skill_path || '.' }}"
          LAYERS="${{ github.event.inputs.layers || '1' }}"
          FAIL_ON_BELOW_S="${{ github.event.inputs.fail_on_below_s || 'true' }}"

          # Find all SKILL.md files (excluding skill-evaluator itself and eval-results)
          if [ "$SKILL_PATH" = "." ]; then
            SKILLS=$(find . -name 'SKILL.md' \
              -not -path './SKILL.md' \
              -not -path './skill-evaluator/SKILL.md' \
              -not -path './eval-results/*')
          else
            SKILLS="$SKILL_PATH/SKILL.md"
          fi

          if [ -z "$SKILLS" ]; then
            echo "No SKILL.md files found to evaluate."
            # EXIT 0 only when there is truly nothing to evaluate (not a failure)
            exit 0
          fi

          mkdir -p eval-results
          FAILED_SKILLS=()

          for SKILL in $SKILLS; do
            SKILL_DIR=$(dirname "$SKILL")
            SKILL_NAME=$(basename "$SKILL_DIR")
            TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
            OUTPUT_DIR="eval-results/$SKILL_NAME"
            mkdir -p "$OUTPUT_DIR"

            echo "====================================="
            echo "Evaluating: $SKILL_NAME (Layer 1)"
            echo "Output: $OUTPUT_DIR/layer1_${TIMESTAMP}.md"
            echo "====================================="

            EXIT_CODE=0
            if command -v claude &> /dev/null; then
              claude --skill skill-evaluator \
                "评估 $SKILL，仅执行第一层，单模型模式" \
                > "$OUTPUT_DIR/layer1_${TIMESTAMP}.md" 2>&1 || EXIT_CODE=$?
            else
              echo "Claude CLI not available." > "$OUTPUT_DIR/layer1_${TIMESTAMP}.md"
              echo "Install Claude Code CLI (npm install -g @anthropic-ai/claude-code) or set ANTHROPIC_API_KEY."
              EXIT_CODE=1
            fi

            # Check if evaluation result contains below-S grade
            if [ "$FAIL_ON_BELOW_S" = "true" ] && [ -f "$OUTPUT_DIR/layer1_${TIMESTAMP}.md" ]; then
              if grep -qE '等级[[:space:]]*[BCDE]|grade[[:space:]]*:[[:space:]]*"[BCDE]"' \
                "$OUTPUT_DIR/layer1_${TIMESTAMP}.md"; then
                echo "⚠ $SKILL_NAME contains files below S grade."
                FAILED_SKILLS+=("$SKILL_NAME")
              fi
            fi
          done

          # --- Layer 2 / 3 (manual trigger only) ---
          if [ "$LAYERS" = "2" ] || [ "$LAYERS" = "all" ]; then
            echo "Layer 2 evaluation is configured for manual trigger only."
            echo "Prerequisite: all Layer 1 results must be S grade."
            echo "Run manually: claude --skill skill-evaluator '评估 <path>，执行第二层'"
          fi

          if [ "$LAYERS" = "3" ] || [ "$LAYERS" = "all" ]; then
            echo "Layer 3 (architecture) evaluation is configured for manual trigger only."
            echo "Prerequisite: all Layer 2 results must be S grade."
            echo "Run manually: claude --skill skill-evaluator '评估 <path>，执行第三层'"
          fi

          # Fail CI if any skill is below S grade
          if [ "${#FAILED_SKILLS[@]}" -gt 0 ]; then
            echo ""
            echo "❌ CI FAILED: The following skills have files below S grade (9.0):"
            for s in "${FAILED_SKILLS[@]}"; do
              echo "  - $s"
            done
            echo "Review eval-results artifacts for details."
            exit 1
          fi

          echo "✅ All evaluated skills passed Layer 1 quality check."

      - name: Upload Evaluation Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: eval-results/
          retention-days: 90

      # Save incremental evaluation state for next run
      - name: Save eval-state cache
        if: always()
        uses: actions/cache@v4
        with:
          path: eval-results/eval-state.json
          key: eval-state-${{ github.repository }}-${{ github.ref_name }}
